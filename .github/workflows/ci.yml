name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate fortune file
        run: make test

      - name: Install fortune
        run: |
          sudo apt-get update
          sudo apt-get -y install fortune

      - name: Compile fortune file
        run: strfile devops